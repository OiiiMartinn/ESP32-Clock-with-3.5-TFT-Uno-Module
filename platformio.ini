[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.31
    bblanchon/ArduinoJson @ ^6.21.5
    arduino-libraries/NTPClient @ ^3.2.1
    marian-craciunescu/ESP32Ping @ ^1.7

build_flags =
    -D USER_SETUP_LOADED=1
    -D RPI_ILI9486_DRIVER=1    ; ganti dari ILI9486_DRIVER ke ALT
    -D TFT_PARALLEL_8_BIT=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480

    ; Control Pins
    -D TFT_RST=26
    -D TFT_CS=27
    -D TFT_DC=14
    -D TFT_WR=12
    -D TFT_RD=13

    ; Data Pins (8-bit)
    -D TFT_D0=16
    -D TFT_D1=4
    -D TFT_D2=23
    -D TFT_D3=22
    -D TFT_D4=21
    -D TFT_D5=19
    -D TFT_D6=18
    -D TFT_D7=17

    ; Kalau backlight terhubung ke GPIO tertentu (bukan langsung ke VCC), aktifkan 2 baris ini:
    ; -D TFT_BL=32
    ; -D TFT_BACKLIGHT_ON=HIGH

    ; Font-font default yang biasa dipakai TFT_eSPI, aman ditambahin
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1